<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient: deep blue water flow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>

    <!-- Water ripple gradient -->
    <radialGradient id="rippleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8E8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00A8E8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00A8E8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for water drop -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave path for flowing water effect -->
    <path id="wave1" d="M0,600 Q480,500 960,600 T1920,600 L1920,1080 L0,1080 Z" fill="#00A8E8" opacity="0.08"/>
    <path id="wave2" d="M0,650 Q480,550 960,650 T1920,650 L1920,1080 L0,1080 Z" fill="#00A8E8" opacity="0.05"/>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Flowing water waves at bottom -->
  <use href="#wave1"/>
  <use href="#wave2"/>

  <!-- Animated ripples (concentric circles) -->
  <g transform="translate(960, 480)">
    <circle r="80" fill="none" stroke="#00A8E8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="80;200;320" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="80" fill="none" stroke="#00A8E8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="80;200;320" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="80" fill="none" stroke="#00A8E8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="80;200;320" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central water drop -->
  <g transform="translate(960, 480)" filter="url(#glow)">
    <path d="M0,-40 C-22,-10 -35,15 -35,35 C-35,65 -15,80 0,80 C15,80 35,65 35,35 C35,15 22,-10 0,-40 Z" fill="#00A8E8" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Highlight on drop -->
    <ellipse cx="-10" cy="20" rx="8" ry="12" fill="#FFFFFF" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Title text -->
  <text x="960" y="620" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="2">
    RiverWatch
  </text>
  <text x="960" y="690" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="600" fill="#FFFFFF" letter-spacing="8">
    河流水质数据看板
  </text>

  <!-- Subtitle -->
  <text x="960" y="760" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#00A8E8" letter-spacing="6">
    实时监测 · 智能预警 · 移动优先
  </text>

  <!-- Date -->
  <text x="960" y="820" text-anchor="middle" font-family="'DIN 1451', 'Roboto Mono', 'SF Mono', monospace" font-size="18" font-weight="400" fill="#6B7280" letter-spacing="2">
    2025年6月
  </text>

  <!-- Decorative particles -->
  <circle cx="200" cy="200" r="3" fill="#00A8E8" opacity="0.4">
    <animate attributeName="cy" values="200;180;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1700" cy="300" r="4" fill="#00A8E8" opacity="0.3">
    <animate attributeName="cy" values="300;270;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="800" r="2" fill="#00A8E8" opacity="0.5">
    <animate attributeName="cy" values="800;770;800" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1600" cy="700" r="3" fill="#00A8E8" opacity="0.35">
    <animate attributeName="cy" values="700;680;700" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.1;0.35" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>