<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EEF3"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0A2540" flood-opacity="0.1"/>
    </filter>

    <!-- Growth curve gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00A8E8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    政策加码 + 市场刚需，智慧水务势在必行
  </text>

  <!-- Three columns layout -->
  <!-- Column 1: Policy -->
  <g transform="translate(80, 160)" filter="url(#cardShadow3)">
    <rect width="540" height="520" rx="12" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="0" y="0" width="540" height="80" rx="12" fill="#0A2540"/>
    <rect x="0" y="60" width="540" height="20" fill="#0A2540"/>
    <text x="270" y="50" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">📋 政策侧</text>

    <!-- Policy items -->
    <g transform="translate(30, 110)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="480" height="100" rx="8" fill="#F0F4F8"/>
      <text x="20" y="35" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">《水污染防治行动计划》</text>
      <text x="20" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">要求重点流域实时监控</text>
      <circle cx="440" cy="50" r="16" fill="#00A8E8" opacity="0.1"/>
      <text x="440" y="55" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#00A8E8">📄</text>
    </g>

    <g transform="translate(30, 230)">
      <!-- Item 2 -->
      <rect x="0" y="0" width="480" height="100" rx="8" fill="#F0F4F8"/>
      <text x="20" y="35" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">河长制考核</text>
      <text x="20" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">水质达标率纳入政绩指标</text>
      <circle cx="440" cy="50" r="16" fill="#10B981" opacity="0.1"/>
      <text x="440" y="55" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#10B981">🏛</text>
    </g>

    <g transform="translate(30, 350)">
      <!-- Item 3 -->
      <rect x="0" y="0" width="480" height="100" rx="8" fill="#F0F4F8"/>
      <text x="20" y="35" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">"十四五"规划</text>
      <text x="20" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">智慧环保投入年增 15%</text>
      <circle cx="440" cy="50" r="16" fill="#F59E0B" opacity="0.1"/>
      <text x="440" y="55" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#F59E0B">📈</text>
    </g>
  </g>

  <!-- Column 2: Market -->
  <g transform="translate(660, 160)" filter="url(#cardShadow3)">
    <rect width="540" height="520" rx="12" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="0" y="0" width="540" height="80" rx="12" fill="#00A8E8"/>
    <rect x="0" y="60" width="540" height="20" fill="#00A8E8"/>
    <text x="270" y="50" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">💰 市场侧</text>

    <!-- Market chart -->
    <g transform="translate(30, 110)">
      <!-- Growth curve -->
      <path d="M40,200 Q100,180 160,150 T280,100 T400,50" fill="none" stroke="#00A8E8" stroke-width="3" stroke-linecap="round"/>
      <path d="M40,200 Q100,180 160,150 T280,100 T400,50 L400,200 L40,200 Z" fill="url(#growthGrad)"/>

      <!-- Data points -->
      <circle cx="40" cy="200" r="6" fill="#00A8E8"/>
      <circle cx="160" cy="150" r="6" fill="#00A8E8"/>
      <circle cx="280" cy="100" r="6" fill="#00A8E8"/>
      <circle cx="400" cy="50" r="8" fill="#10B981"/>

      <!-- Labels -->
      <text x="40" y="230" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">2022</text>
      <text x="160" y="230" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">2023</text>
      <text x="280" y="230" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">2024</text>
      <text x="400" y="230" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">2025E</text>

      <!-- Highlight box -->
      <rect x="320" y="20" width="160" height="50" rx="8" fill="#10B981" opacity="0.1"/>
      <text x="400" y="42" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="20" font-weight="700" fill="#10B981">180亿元</text>
      <text x="400" y="60" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">2024年市场规模</text>
    </g>

    <!-- Stats -->
    <g transform="translate(30, 360)">
      <rect x="0" y="0" width="230" height="80" rx="8" fill="#F0F4F8"/>
      <text x="115" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#00A8E8">12.3%</text>
      <text x="115" y="58" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">年复合增长率</text>

      <rect x="250" y="0" width="230" height="80" rx="8" fill="#F0F4F8"/>
      <text x="365" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#F59E0B">25%</text>
      <text x="365" y="58" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">移动端增速</text>
    </g>
  </g>

  <!-- Column 3: Demand -->
  <g transform="translate(1240, 160)" filter="url(#cardShadow3)">
    <rect width="540" height="520" rx="12" fill="#FFFFFF"/>
    <!-- Header -->
    <rect x="0" y="0" width="540" height="80" rx="12" fill="#10B981"/>
    <rect x="0" y="60" width="540" height="20" fill="#10B981"/>
    <text x="270" y="50" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">👥 需求侧</text>

    <!-- User personas -->
    <g transform="translate(30, 110)">
      <!-- Persona 1 -->
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#F0F4F8"/>
      <circle cx="50" cy="55" r="28" fill="#00A8E8" opacity="0.1"/>
      <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#00A8E8">👤</text>
      <text x="95" y="40" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">基层河长</text>
      <text x="95" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">日常巡检需实时数据支撑</text>
      <text x="95" y="88" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#00A8E8" font-weight="500">📍 现场决策</text>
    </g>

    <g transform="translate(30, 240)">
      <!-- Persona 2 -->
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#F0F4F8"/>
      <circle cx="50" cy="55" r="28" fill="#10B981" opacity="0.1"/>
      <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10B981">👔</text>
      <text x="95" y="40" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">水务管理人员</text>
      <text x="95" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">会议汇报需直观展示</text>
      <text x="95" y="88" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981" font-weight="500">📊 数据驱动</text>
    </g>

    <g transform="translate(30, 370)">
      <!-- Persona 3 -->
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#F0F4F8"/>
      <circle cx="50" cy="55" r="28" fill="#F59E0B" opacity="0.1"/>
      <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#F59E0B">🌐</text>
      <text x="95" y="40" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">公众 / 媒体</text>
      <text x="95" y="65" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">环境知情权要求信息透明</text>
      <text x="95" y="88" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#F59E0B" font-weight="500">🔍 信息公开</text>
    </g>
  </g>

  <!-- Bottom arrow: transition to solution -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="1760" height="60" rx="12" fill="url(#arrowGrad)" opacity="0.1"/>
    <text x="880" y="38" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="500" fill="#00A8E8">
      政策 + 市场 + 需求 三重驱动 → 智慧水务解决方案势在必行
    </text>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">03 / 10</text>
</svg>