<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>

    <!-- Gauge gradients -->
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="doGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad7)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    专业级可视化设计
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#6B7280">
    数据一目了然
  </text>

  <!-- Section 1: Gauge Charts -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">指标仪表盘</text>

    <!-- pH Gauge -->
    <g transform="translate(0, 20)">
      <rect width="200" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="220" rx="2" fill="#8B5CF6"/>
      <!-- Gauge arc -->
      <path d="M 40 160 A 60 60 0 0 1 160 160" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
      <path d="M 40 160 A 60 60 0 0 1 100 100" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"/>
      <!-- Value -->
      <text x="100" y="145" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#0A2540">7.2</text>
      <text x="100" y="170" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">pH 值</text>
      <!-- Range -->
      <text x="100" y="200" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#10B981">正常: 6.5 - 8.5</text>
    </g>

    <!-- DO Gauge -->
    <g transform="translate(220, 20)">
      <rect width="200" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="220" rx="2" fill="#06B6D4"/>
      <path d="M 40 160 A 60 60 0 0 1 160 160" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
      <path d="M 40 160 A 60 60 0 0 1 130 115" fill="none" stroke="url(#doGrad)" stroke-width="12" stroke-linecap="round"/>
      <text x="100" y="145" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#0A2540">4.8</text>
      <text x="100" y="170" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">溶解氧 mg/L</text>
      <text x="100" y="200" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#F59E0B">警告: ≥ 5.0</text>
    </g>

    <!-- Turbidity Gauge -->
    <g transform="translate(440, 20)">
      <rect width="200" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="220" rx="2" fill="#10B981"/>
      <path d="M 40 160 A 60 60 0 0 1 160 160" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
      <path d="M 40 160 A 60 60 0 0 1 70 108" fill="none" stroke="#0EA5E9" stroke-width="12" stroke-linecap="round"/>
      <text x="100" y="145" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#0A2540">6.5</text>
      <text x="100" y="170" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">浊度 NTU</text>
      <text x="100" y="200" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#10B981">正常: ≤ 10</text>
    </g>

    <!-- Ammonia Gauge -->
    <g transform="translate(660, 20)">
      <rect width="200" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="220" rx="2" fill="#EF4444"/>
      <path d="M 40 160 A 60 60 0 0 1 160 160" fill="none" stroke="#E5E7EB" stroke-width="12" stroke-linecap="round"/>
      <path d="M 40 160 A 60 60 0 0 1 160 100" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
      <text x="100" y="145" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#0A2540">1.35</text>
      <text x="100" y="170" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">氨氮 mg/L</text>
      <text x="100" y="200" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#EF4444">超标: ≤ 1.0</text>
    </g>

    <!-- Station Status -->
    <g transform="translate(880, 20)">
      <rect width="200" height="220" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="220" rx="2" fill="#10B981"/>
      <!-- Pulse animation representation -->
      <circle cx="100" cy="100" r="30" fill="#10B981" opacity="0.1"/>
      <circle cx="100" cy="100" r="20" fill="#10B981" opacity="0.2"/>
      <circle cx="100" cy="100" r="10" fill="#10B981"/>
      <text x="100" y="155" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="28" font-weight="700" fill="#0A2540">Ⅱ级</text>
      <text x="100" y="180" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">站点状态</text>
      <text x="100" y="200" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#10B981">良好 · 脉冲灯指示</text>
    </g>
  </g>

  <!-- Section 2: Trend Chart -->
  <g transform="translate(80, 500)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">趋势图表</text>

    <rect x="0" y="20" width="700" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- Chart title -->
    <text x="30" y="55" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">近7天 pH 变化趋势</text>
    <text x="30" y="75" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">多站点对比 · 异常自动标注</text>

    <!-- Chart area -->
    <g transform="translate(30, 100)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="640" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="50" x2="640" y2="50" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="100" x2="640" y2="100" stroke="#E5E7EB" stroke-width="1"/>
      <line x1="0" y1="150" x2="640" y2="150" stroke="#E5E7EB" stroke-width="1"/>

      <!-- Line 1: Normal station -->
      <polyline points="0,80 91,70 182,75 273,65 364,72 455,68 546,70 640,75" fill="none" stroke="#00A8E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Data points -->
      <circle cx="0" cy="80" r="4" fill="#00A8E8"/>
      <circle cx="91" cy="70" r="4" fill="#00A8E8"/>
      <circle cx="182" cy="75" r="4" fill="#00A8E8"/>
      <circle cx="273" cy="65" r="4" fill="#00A8E8"/>
      <circle cx="364" cy="72" r="4" fill="#00A8E8"/>
      <circle cx="455" cy="68" r="4" fill="#00A8E8"/>
      <circle cx="546" cy="70" r="4" fill="#00A8E8"/>
      <circle cx="640" cy="75" r="4" fill="#00A8E8"/>

      <!-- Line 2: Warning station -->
      <polyline points="0,100 91,110 182,105 273,120 364,115 455,125 546,118 640,122" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="273" cy="120" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="455" cy="125" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="640" cy="122" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Anomaly highlight -->
      <circle cx="455" cy="125" r="10" fill="#F59E0B" opacity="0.2"/>
      <text x="455" y="105" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="#F59E0B" font-weight="500">异常</text>

      <!-- X-axis labels -->
      <text x="0" y="175" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="11" fill="#6B7280">D-7</text>
      <text x="182" y="175" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="11" fill="#6B7280">D-5</text>
      <text x="364" y="175" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="11" fill="#6B7280">D-3</text>
      <text x="546" y="175" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="11" fill="#6B7280">D-1</text>
      <text x="640" y="175" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="11" fill="#6B7280">今天</text>
    </g>

    <!-- Legend -->
    <g transform="translate(500, 55)">
      <circle cx="0" cy="0" r="5" fill="#00A8E8"/>
      <text x="12" y="4" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">青龙溪上游</text>
      <circle cx="100" cy="0" r="5" fill="#F59E0B"/>
      <text x="112" y="4" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">黄石工业园段</text>
    </g>
  </g>

  <!-- Section 3: Interaction Design -->
  <g transform="translate(820, 500)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">交互设计</text>

    <!-- Interaction 1: Pull to refresh -->
    <rect x="0" y="20" width="460" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="20" width="4" height="80" rx="2" fill="#00A8E8"/>
    <text x="20" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">下拉刷新</text>
    <text x="20" y="72" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">实时获取最新监测数据</text>
    <text x="20" y="90" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#00A8E8">手势 ↓</text>

    <!-- Interaction 2: Pinch zoom -->
    <rect x="0" y="115" width="460" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="115" width="4" height="80" rx="2" fill="#10B981"/>
    <text x="20" y="145" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">双指缩放</text>
    <text x="20" y="167" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">图表细节查看，数据点精确读取</text>
    <text x="20" y="185" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#10B981">手势 ↔</text>

    <!-- Interaction 3: Swipe -->
    <rect x="0" y="210" width="460" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="210" width="4" height="80" rx="2" fill="#F59E0B"/>
    <text x="20" y="240" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">站点滑动</text>
    <text x="20" y="262" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">横向切换监测点，快速对比</text>
    <text x="20" y="280" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#F59E0B">手势 ← →</text>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">07 / 10</text>
</svg>