<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient: light gray-white -->
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>

    <!-- Donut chart gradients -->
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="otherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad8)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    ≤ 5 万预算，4 周交付，性价比最优解
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#6B7280">
    商业可行性分析
  </text>

  <!-- Left: Budget donut chart -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">预算构成</text>

    <rect x="0" y="20" width="520" height="420" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="20" width="4" height="420" rx="2" fill="#00A8E8"/>

    <!-- Donut chart: 48.2% human + 10% tool + 41.8% other -->
    <g transform="translate(260, 230)">
      <!-- Background circle -->
      <circle r="120" fill="none" stroke="#E5E7EB" stroke-width="24"/>
      <!-- Human 48.2% (173.5 degrees) -->
      <circle r="120" fill="none" stroke="url(#humanGrad)" stroke-width="24"
              stroke-dasharray="433.5 753.98" stroke-dashoffset="0"
              transform="rotate(-90)"/>
      <!-- Tool 10% (36 degrees) -->
      <circle r="120" fill="none" stroke="url(#toolGrad)" stroke-width="24"
              stroke-dasharray="90 753.98" stroke-dashoffset="-433.5"
              transform="rotate(-90)"/>
      <!-- Other 41.8% (150.5 degrees) -->
      <circle r="120" fill="none" stroke="url(#otherGrad)" stroke-width="24"
              stroke-dasharray="376.3 753.98" stroke-dashoffset="-523.5"
              transform="rotate(-90)"/>

      <!-- Center text -->
      <text x="0" y="-10" text-anchor="middle" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="48" font-weight="700" fill="#0A2540">¥50,000</text>
      <text x="0" y="20" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">项目总预算</text>
    </g>

    <!-- Legend -->
    <g transform="translate(40, 380)">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#humanGrad)"/>
      <text x="26" y="13" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540">人力成本 ¥24,100</text>
      <text x="26" y="30" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">48.2%</text>

      <rect x="200" y="0" width="16" height="16" rx="4" fill="url(#toolGrad)"/>
      <text x="226" y="13" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540">工具资源 ¥5,000</text>
      <text x="226" y="30" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">10%</text>

      <rect x="0" y="50" width="16" height="16" rx="4" fill="url(#otherGrad)"/>
      <text x="26" y="63" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540">其他费用 ¥20,900</text>
      <text x="26" y="80" font-family="'DIN 1451', monospace" font-size="12" fill="#6B7280">41.8%</text>
    </g>
  </g>

  <!-- Right: Key metrics -->
  <g transform="translate(640, 200)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">关键指标</text>

    <!-- Total budget card -->
    <rect x="0" y="20" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="20" width="4" height="140" rx="2" fill="#00A8E8"/>
    <text x="20" y="55" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#6B7280">项目总预算</text>
    <text x="20" y="110" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="52" font-weight="700" fill="#0A2540">¥50,000</text>
    <text x="20" y="135" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981">≤ 5 万，可控范围</text>

    <!-- Delivery time card -->
    <rect x="0" y="180" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="180" width="4" height="140" rx="2" fill="#10B981"/>
    <text x="20" y="215" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#6B7280">交付周期</text>
    <text x="20" y="270" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="52" font-weight="700" fill="#0A2540">4 周</text>
    <text x="20" y="295" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981">敏捷开发，快速上线</text>

    <!-- Cost efficiency card -->
    <rect x="300" y="20" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="300" y="20" width="4" height="140" rx="2" fill="#F59E0B"/>
    <text x="320" y="55" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#6B7280">部署成本</text>
    <text x="320" y="110" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="52" font-weight="700" fill="#0A2540">¥0</text>
    <text x="320" y="135" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981">CDN 零服务器成本</text>

    <!-- Team size card -->
    <rect x="300" y="180" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="300" y="180" width="4" height="140" rx="2" fill="#8B5CF6"/>
    <text x="320" y="215" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#6B7280">团队规模</text>
    <text x="320" y="270" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="52" font-weight="700" fill="#0A2540">2 人</text>
    <text x="320" y="295" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981">精简高效，专注交付</text>
  </g>

  <!-- Bottom: Milestone timeline -->
  <g transform="translate(80, 680)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">交付里程碑</text>

    <!-- Timeline bar -->
    <rect x="0" y="40" width="1760" height="4" rx="2" fill="#E5E7EB"/>

    <!-- Week 1 -->
    <g transform="translate(0, 42)">
      <circle r="10" fill="#00A8E8"/>
      <circle r="6" fill="#FFFFFF"/>
      <text x="0" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#0A2540">Week 1</text>
      <rect x="-100" y="50" width="200" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="-100" y="50" width="4" height="80" rx="2" fill="#00A8E8"/>
      <text x="-80" y="80" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">需求确认</text>
      <text x="-80" y="105" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">锁定需求细节</text>
      <text x="-80" y="122" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">确定站点位置</text>
    </g>

    <!-- Arrow 1→2 -->
    <path d="M 120 42 L 320 42" fill="none" stroke="#00A8E8" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="320,42 310,36 310,48" fill="#00A8E8"/>

    <!-- Week 2 -->
    <g transform="translate(440, 42)">
      <circle r="10" fill="#10B981"/>
      <circle r="6" fill="#FFFFFF"/>
      <text x="0" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#0A2540">Week 2</text>
      <rect x="-100" y="50" width="200" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="-100" y="50" width="4" height="80" rx="2" fill="#10B981"/>
      <text x="-80" y="80" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">原型评审</text>
      <text x="-80" y="105" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">UI/UX 设计确认</text>
      <text x="-80" y="122" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">技术方案评审</text>
    </g>

    <!-- Arrow 2→3 -->
    <path d="M 560 42 L 760 42" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="760,42 750,36 750,48" fill="#10B981"/>

    <!-- Week 3 -->
    <g transform="translate(880, 42)">
      <circle r="10" fill="#F59E0B"/>
      <circle r="6" fill="#FFFFFF"/>
      <text x="0" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#0A2540">Week 3</text>
      <rect x="-100" y="50" width="200" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="-100" y="50" width="4" height="80" rx="2" fill="#F59E0B"/>
      <text x="-80" y="80" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">开发实现</text>
      <text x="-80" y="105" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">前端开发完成</text>
      <text x="-80" y="122" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">数据接口联调</text>
    </g>

    <!-- Arrow 3→4 -->
    <path d="M 1000 42 L 1200 42" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="1200,42 1190,36 1190,48" fill="#F59E0B"/>

    <!-- Week 4 -->
    <g transform="translate(1320, 42)">
      <circle r="10" fill="#EF4444"/>
      <circle r="6" fill="#FFFFFF"/>
      <text x="0" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#0A2540">Week 4</text>
      <rect x="-100" y="50" width="200" height="80" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="-100" y="50" width="4" height="80" rx="2" fill="#EF4444"/>
      <text x="-80" y="80" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">测试上线</text>
      <text x="-80" y="105" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">功能测试验收</text>
      <text x="-80" y="122" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">部署上线交付</text>
    </g>

    <!-- Arrow 4→finish -->
    <path d="M 1440 42 L 1640 42" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="1640,42 1630,36 1630,48" fill="#EF4444"/>

    <!-- Finish flag -->
    <g transform="translate(1720, 42)">
      <circle r="10" fill="#10B981"/>
      <text x="0" y="35" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#0A2540">交付</text>
      <text x="0" y="52" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981" font-weight="600">✓ 项目完成</text>
    </g>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">08 / 10</text>
</svg>
