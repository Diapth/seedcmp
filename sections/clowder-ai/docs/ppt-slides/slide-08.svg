<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>

    <!-- Donut segment colors -->
    <linearGradient id="donutHuman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="donutTools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="donutOther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00A8E8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad8)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    ≤ 5 万预算，4 周交付，性价比最优解
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#6B7280">
    资源投入透明，里程碑清晰可控
  </text>

  <!-- ===== LEFT: Budget Donut Chart ===== -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">预算分配</text>

    <!-- Donut chart container -->
    <g transform="translate(200, 180)">
      <!-- Background ring -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#E5E7EB" stroke-width="40"/>

      <!-- Human cost: 84% (302.4 degrees) -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#donutHuman)" stroke-width="40"
              stroke-dasharray="738 880" stroke-dashoffset="0" transform="rotate(-90)"/>

      <!-- Tools: 6% (21.6 degrees) -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#donutTools)" stroke-width="40"
              stroke-dasharray="53 880" stroke-dashoffset="-738" transform="rotate(-90)"/>

      <!-- Reserve: 10% (36 degrees) -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#donutOther)" stroke-width="40"
              stroke-dasharray="88 880" stroke-dashoffset="-791" transform="rotate(-90)"/>

      <!-- Center text -->
      <text x="0" y="-15" text-anchor="middle" font-family="'DIN 1451', 'Roboto Mono', monospace" font-size="56" font-weight="700" fill="#0A2540">¥50,000</text>
      <text x="0" y="20" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="16" fill="#6B7280">总预算</text>
    </g>

    <!-- Legend -->
    <g transform="translate(0, 360)">
      <!-- Legend item 1: Human -->
      <rect x="0" y="0" width="16" height="16" rx="4" fill="url(#donutHuman)"/>
      <text x="28" y="14" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">人力成本</text>
      <text x="120" y="14" font-family="'DIN 1451', monospace" font-size="14" fill="#0A2540" font-weight="700">¥42,000</text>
      <text x="210" y="14" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">84%</text>

      <!-- Legend item 2: Tools -->
      <rect x="0" y="32" width="16" height="16" rx="4" fill="url(#donutTools)"/>
      <text x="28" y="46" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">工具与服务</text>
      <text x="120" y="46" font-family="'DIN 1451', monospace" font-size="14" fill="#0A2540" font-weight="700">¥3,000</text>
      <text x="210" y="46" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">6%</text>

      <!-- Legend item 3: Reserve -->
      <rect x="0" y="64" width="16" height="16" rx="4" fill="url(#donutOther)"/>
      <text x="28" y="78" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">风险储备</text>
      <text x="120" y="78" font-family="'DIN 1451', monospace" font-size="14" fill="#0A2540" font-weight="700">¥5,000</text>
      <text x="210" y="78" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">10%</text>
    </g>
  </g>

  <!-- ===== RIGHT: Milestone Timeline ===== -->
  <g transform="translate(560, 200)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">交付里程碑</text>

    <!-- Timeline bar -->
    <rect x="0" y="60" width="1280" height="6" rx="3" fill="#E5E7EB"/>

    <!-- Week 1 -->
    <g transform="translate(0, 40)">
      <circle cx="20" cy="23" r="16" fill="#00A8E8"/>
      <text x="20" y="28" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">W1</text>
      <rect x="0" y="80" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="80" width="4" height="140" rx="2" fill="#00A8E8"/>
      <text x="20" y="110" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">Week 1 · 需求确认</text>
      <text x="20" y="140" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• 需求细节确认</text>
      <text x="20" y="165" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• PRD 定稿</text>
      <text x="20" y="190" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• 视觉规范确定</text>
    </g>

    <!-- Arrow 1→2 -->
    <line x1="300" y1="63" x2="340" y2="63" stroke="#00A8E8" stroke-width="2" marker-end="url(#arrowHead)"/>

    <!-- Week 2-3 -->
    <g transform="translate(360, 40)">
      <circle cx="20" cy="23" r="16" fill="#10B981"/>
      <text x="20" y="28" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">W2</text>
      <rect x="0" y="80" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="80" width="4" height="140" rx="2" fill="#10B981"/>
      <text x="20" y="110" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">Week 2-3 · 开发</text>
      <text x="20" y="140" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• Vue 单页面开发</text>
      <text x="20" y="165" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• 模拟数据集成</text>
      <text x="20" y="190" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• PPT 制作并行</text>
    </g>

    <!-- Arrow 2→3 -->
    <line x1="660" y1="63" x2="700" y2="63" stroke="#00A8E8" stroke-width="2" marker-end="url(#arrowHead)"/>

    <!-- Week 4 -->
    <g transform="translate(720, 40)">
      <circle cx="20" cy="23" r="16" fill="#F59E0B"/>
      <text x="20" y="28" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">W4</text>
      <rect x="0" y="80" width="280" height="140" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
      <rect x="0" y="80" width="4" height="140" rx="2" fill="#F59E0B"/>
      <text x="20" y="110" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0A2540">Week 4 · 测试上线</text>
      <text x="20" y="140" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• QA 验收测试</text>
      <text x="20" y="165" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• 部署交付</text>
      <text x="20" y="190" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">• 汇报演示</text>
    </g>

    <!-- Arrow 3→4 -->
    <line x1="1020" y1="63" x2="1060" y2="63" stroke="#00A8E8" stroke-width="2" marker-end="url(#arrowHead)"/>

    <!-- Complete -->
    <g transform="translate(1080, 40)">
      <circle cx="20" cy="23" r="16" fill="#0A2540"/>
      <text x="20" y="28" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">✓</text>
      <rect x="0" y="80" width="200" height="140" rx="12" fill="#0A2540" filter="url(#cardShadow)"/>
      <text x="100" y="130" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">项目交付</text>
      <text x="100" y="160" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#00A8E8">4 周</text>
      <text x="100" y="190" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">全部交付物</text>
    </g>
  </g>

  <!-- ===== BOTTOM: Key Metrics Bar ===== -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="1760" height="120" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="120" rx="2" fill="#00A8E8"/>

    <!-- Metric 1 -->
    <text x="40" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">总预算</text>
    <text x="40" y="85" font-family="'DIN 1451', monospace" font-size="32" font-weight="700" fill="#0A2540">¥50,000</text>

    <!-- Divider -->
    <line x1="280" y1="30" x2="280" y2="90" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Metric 2 -->
    <text x="320" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">交付周期</text>
    <text x="320" y="85" font-family="'DIN 1451', monospace" font-size="32" font-weight="700" fill="#00A8E8">4 周</text>

    <!-- Divider -->
    <line x1="560" y1="30" x2="560" y2="90" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Metric 3 -->
    <text x="600" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">团队规模</text>
    <text x="600" y="85" font-family="'DIN 1451', monospace" font-size="32" font-weight="700" fill="#0A2540">7 人</text>

    <!-- Divider -->
    <line x1="840" y1="30" x2="840" y2="90" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Metric 4 -->
    <text x="880" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">人天投入</text>
    <text x="880" y="85" font-family="'DIN 1451', monospace" font-size="32" font-weight="700" fill="#0A2540">35 天</text>

    <!-- Divider -->
    <line x1="1120" y1="30" x2="1120" y2="90" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Metric 5 -->
    <text x="1160" y="50" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">部署成本</text>
    <text x="1160" y="85" font-family="'DIN 1451', monospace" font-size="32" font-weight="700" fill="#10B981">¥0</text>
    <text x="1240" y="85" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">免费托管</text>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">08 / 10</text>
</svg>