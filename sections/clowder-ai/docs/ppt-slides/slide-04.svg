<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0A2540" flood-opacity="0.1"/>
    </filter>

    <!-- Phone screen gradient -->
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#00A8E8"/>
    </linearGradient>

    <!-- Glow for phone -->
    <filter id="phoneGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad4)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    RiverWatch — 移动端水质监测
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#6B7280">
    随时随地掌握河流健康
  </text>

  <!-- Left side: Product positioning -->
  <g transform="translate(80, 220)" filter="url(#cardShadow4)">
    <rect width="480" height="200" rx="12" fill="#FFFFFF"/>
    <rect x="0" y="0" width="4" height="200" rx="2" fill="#00A8E8"/>
    <text x="30" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">🎯 产品定位</text>
    <text x="30" y="85" font-family="'Noto Sans SC', sans-serif" font-size="16" fill="#6B7280">• 面向基层环保人员的移动端水质监测看板</text>
    <text x="30" y="120" font-family="'Noto Sans SC', sans-serif" font-size="16" fill="#6B7280">• 无需安装 App，浏览器即开即用</text>
    <rect x="30" y="150" width="200" height="36" rx="18" fill="#00A8E8" opacity="0.1"/>
    <text x="130" y="174" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#00A8E8" font-weight="500">📱 零安装 · 零门槛</text>
  </g>

  <!-- Center: Phone mockup -->
  <g transform="translate(660, 200)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="280" height="560" rx="32" fill="#0A2540" filter="url(#phoneGlow)"/>
    <rect x="10" y="10" width="260" height="540" rx="24" fill="#FFFFFF"/>

    <!-- Screen content -->
    <rect x="20" y="20" width="240" height="520" rx="16" fill="url(#phoneScreen)"/>

    <!-- App header -->
    <text x="140" y="55" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">RiverWatch</text>

    <!-- Mini gauge charts -->
    <g transform="translate(40, 80)">
      <!-- Gauge 1: pH -->
      <arc cx="50" cy="50" r="35" start="0" end="180" fill="none" stroke="#10B981" stroke-width="6"/>
      <path d="M50,85 A35,35 0 0,1 15,50" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
      <text x="50" y="55" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="16" font-weight="700" fill="#FFFFFF">7.2</text>
      <text x="50" y="72" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">pH</text>
    </g>

    <g transform="translate(150, 80)">
      <!-- Gauge 2: DO -->
      <path d="M50,85 A35,35 0 0,1 20,60" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
      <text x="50" y="55" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="16" font-weight="700" fill="#FFFFFF">4.8</text>
      <text x="50" y="72" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">DO</text>
    </g>

    <!-- Mini chart -->
    <g transform="translate(40, 180)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#FFFFFF" opacity="0.1"/>
      <path d="M10,80 L40,60 L70,70 L100,40 L130,50 L160,30 L190,45" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="100" cy="40" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Status bar -->
    <g transform="translate(40, 300)">
      <rect x="0" y="0" width="200" height="50" rx="8" fill="#FFFFFF" opacity="0.15"/>
      <circle cx="25" cy="25" r="8" fill="#10B981"/>
      <text x="45" y="22" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="#FFFFFF">长江大桥监测点</text>
      <text x="45" y="38" font-family="'Noto Sans SC', sans-serif" font-size="9" fill="#FFFFFF" opacity="0.7">状态正常</text>
    </g>

    <!-- Bottom nav -->
    <g transform="translate(40, 400)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#FFFFFF" opacity="0.1"/>
      <text x="100" y="25" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="10" fill="#FFFFFF">📊 趋势 · 🗺 地图 · ⚙ 设置</text>
    </g>

    <!-- Notch -->
    <rect x="90" y="10" width="100" height="24" rx="12" fill="#0A2540"/>
  </g>

  <!-- Right side: Core capabilities -->
  <g transform="translate(1000, 220)" filter="url(#cardShadow4)">
    <rect width="480" height="280" rx="12" fill="#FFFFFF"/>
    <rect x="0" y="0" width="4" height="280" rx="2" fill="#00A8E8"/>
    <text x="30" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">⚡ 核心能力</text>

    <text x="30" y="85" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#00A8E8">实时数据</text>
    <text x="30" y="110" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">5 项核心指标秒级刷新</text>

    <text x="30" y="150" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#10B981">可视化呈现</text>
    <text x="30" y="175" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">仪表盘 + 趋势图 + 站点地图</text>

    <text x="30" y="215" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="600" fill="#F59E0B">异常预警</text>
    <text x="30" y="240" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">超标自动标红，分钟级响应</text>
  </g>

  <!-- Bottom: Use cases -->
  <g transform="translate(1000, 530)" filter="url(#cardShadow4)">
    <rect width="480" height="230" rx="12" fill="#FFFFFF"/>
    <rect x="0" y="0" width="4" height="230" rx="2" fill="#10B981"/>
    <text x="30" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">🎯 使用场景</text>

    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="140" height="130" rx="8" fill="#F0F4F8"/>
      <text x="70" y="40" text-anchor="middle" font-family="sans-serif" font-size="24">🔬</text>
      <text x="70" y="70" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">日常巡检</text>
      <text x="70" y="95" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">口袋里的水质</text>
      <text x="70" y="110" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">实验室</text>
    </g>

    <g transform="translate(185, 70)">
      <rect x="0" y="0" width="140" height="130" rx="8" fill="#F0F4F8"/>
      <text x="70" y="40" text-anchor="middle" font-family="sans-serif" font-size="24">🚨</text>
      <text x="70" y="70" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">应急事件</text>
      <text x="70" y="95" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">现场快速判断</text>
      <text x="70" y="110" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">污染程度</text>
    </g>

    <g transform="translate(340, 70)">
      <rect x="0" y="0" width="120" height="130" rx="8" fill="#F0F4F8"/>
      <text x="60" y="40" text-anchor="middle" font-family="sans-serif" font-size="24">📊</text>
      <text x="60" y="70" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#0A2540">汇报展示</text>
      <text x="60" y="95" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">数据说话，</text>
      <text x="60" y="110" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#6B7280">一目了然</text>
    </g>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">04 / 10</text>
</svg>