<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient: light gray-white (consistent with P2-P9) -->
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>

    <!-- CTA button shadow -->
    <filter id="ctaShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00A8E8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad10)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#00A8E8"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    立即启动，4 周见成果
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#6B7280">
    三步走，从需求确认到交付上线
  </text>

  <!-- ===== THREE ACTION CARDS ===== -->
  <!-- Card 1: Week 1 -->
  <g transform="translate(80, 200)">
    <rect width="540" height="340" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="340" rx="2" fill="#00A8E8"/>

    <!-- Step number -->
    <circle cx="50" cy="50" r="28" fill="#00A8E8"/>
    <text x="50" y="58" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="24" font-weight="700" fill="#FFFFFF">①</text>

    <text x="95" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">本周</text>
    <text x="95" y="70" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">确认需求细节</text>

    <!-- Action items -->
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#00A8E8"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">确认监测站点具体位置</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">5个站点坐标、命名规范</text>
    </g>

    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#00A8E8"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">核实数据更新频率要求</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">5分钟/15分钟/实时</text>
    </g>

    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#00A8E8"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">确定品牌视觉偏好</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">配色方案、LOGO、字体</text>
    </g>

    <!-- Timeline dot -->
    <text x="30" y="320" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#00A8E8" font-weight="500">Day 1-3</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(640, 370)">
    <path d="M0 0 L30 0" fill="none" stroke="#00A8E8" stroke-width="2"/>
    <polygon points="30,0 20,-6 20,6" fill="#00A8E8"/>
  </g>

  <!-- Card 2: Week 2 -->
  <g transform="translate(680, 200)">
    <rect width="540" height="340" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="340" rx="2" fill="#10B981"/>

    <circle cx="50" cy="50" r="28" fill="#10B981"/>
    <text x="50" y="58" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="24" font-weight="700" fill="#FFFFFF">②</text>

    <text x="95" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">第 2 周</text>
    <text x="95" y="70" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">原型评审</text>

    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#10B981"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">视觉设计稿确认</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">UI 风格、配色、图标</text>
    </g>

    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#10B981"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">交互流程走查</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">页面跳转、手势、状态</text>
    </g>

    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#10B981"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">技术方案终审</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">CDN 选型、数据格式、API</text>
    </g>

    <text x="30" y="320" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#10B981" font-weight="500">Day 4-7</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(1240, 370)">
    <path d="M0 0 L30 0" fill="none" stroke="#10B981" stroke-width="2"/>
    <polygon points="30,0 20,-6 20,6" fill="#10B981"/>
  </g>

  <!-- Card 3: Week 3-4 -->
  <g transform="translate(1280, 200)">
    <rect width="540" height="340" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="340" rx="2" fill="#F59E0B"/>

    <circle cx="50" cy="50" r="28" fill="#F59E0B"/>
    <text x="50" y="58" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="24" font-weight="700" fill="#FFFFFF">③</text>

    <text x="95" y="45" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="600" fill="#0A2540">第 3-4 周</text>
    <text x="95" y="70" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">开发上线</text>

    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#F59E0B"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">前端开发（2周）</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">Vue 单页面、图表、响应式</text>
    </g>

    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#F59E0B"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">QA 测试 + 修复</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">功能、兼容、性能测试</text>
    </g>

    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#F0F4F8"/>
      <circle cx="20" cy="27" r="6" fill="#F59E0B"/>
      <text x="40" y="24" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">部署交付 + 汇报 PPT</text>
      <text x="40" y="42" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#6B7280">上线链接、交付物整理</text>
    </g>

    <text x="30" y="320" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#F59E0B" font-weight="500">Day 8-28</text>
  </g>

  <!-- ===== BOTTOM: Contact Bar (dark strip with white text) ===== -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1760" height="180" rx="12" fill="#0A2540" filter="url(#cardShadow)"/>

    <!-- Left: Project team -->
    <g transform="translate(40, 30)">
      <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">项目团队</text>

      <!-- PM -->
      <rect x="0" y="15" width="300" height="55" rx="8" fill="#FFFFFF" opacity="0.1"/>
      <circle cx="25" cy="42" r="16" fill="#00A8E8" opacity="0.2"/>
      <text x="25" y="48" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#00A8E8" font-weight="600">PM</text>
      <text x="55" y="40" font-family="'Noto Sans SC', sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">项目负责人：罗罗</text>
      <text x="55" y="58" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">需求确认 · 进度管控 · 交付协调</text>
    </g>

    <!-- Divider -->
    <line x1="370" y1="25" x2="370" y2="155" stroke="#FFFFFF" opacity="0.1" stroke-width="1"/>

    <!-- Middle: Tech lead -->
    <g transform="translate(390, 30)">
      <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">技术团队</text>

      <rect x="0" y="15" width="300" height="55" rx="8" fill="#FFFFFF" opacity="0.1"/>
      <circle cx="25" cy="42" r="16" fill="#10B981" opacity="0.2"/>
      <text x="25" y="48" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981" font-weight="600">FE</text>
      <text x="55" y="40" font-family="'Noto Sans SC', sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">技术负责人：波波</text>
      <text x="55" y="58" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">前端开发 · 部署运维 · 技术支持</text>
    </g>

    <!-- Divider -->
    <line x1="720" y1="25" x2="720" y2="155" stroke="#FFFFFF" opacity="0.1" stroke-width="1"/>

    <!-- Right: Key metrics -->
    <g transform="translate(740, 30)">
      <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">项目速览</text>

      <g transform="translate(0, 20)">
        <text x="0" y="20" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#FFFFFF">¥50,000</text>
        <text x="0" y="40" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">总预算</text>
      </g>

      <g transform="translate(160, 20)">
        <text x="0" y="20" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#00A8E8">4 周</text>
        <text x="0" y="40" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">交付周期</text>
      </g>

      <g transform="translate(280, 20)">
        <text x="0" y="20" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#10B981">2 人</text>
        <text x="0" y="40" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">团队规模</text>
      </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(1320, 45)">
      <rect x="0" y="0" width="400" height="70" rx="12" fill="#00A8E8" filter="url(#ctaShadow)"/>
      <text x="200" y="30" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">立即启动项目</text>
      <text x="200" y="52" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#FFFFFF" opacity="0.8">本周确认需求，4 周见成果</text>
    </g>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">10 / 10</text>
</svg>
