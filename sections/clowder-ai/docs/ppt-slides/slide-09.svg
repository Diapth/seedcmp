<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient: light gray-white -->
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>

    <!-- Growth arrow gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00A8E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad9)"/>

  <!-- Top accent bar -->
  <rect x="80" y="60" width="80" height="6" rx="3" fill="#10B981"/>

  <!-- Page title -->
  <text x="80" y="110" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0A2540">
    从"事后追溯"到"实时预警"，管理效能全面升级
  </text>
  <text x="80" y="155" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#6B7280">
    预期价值分析 — 效率 · 响应 · 成本
  </text>

  <!-- Three dimension cards -->
  <!-- Card 1: 效率提升 -->
  <g transform="translate(80, 200)">
    <rect width="540" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="280" rx="2" fill="#10B981"/>

    <!-- Icon -->
    <g transform="translate(30, 30)">
      <circle r="24" fill="#10B981" opacity="0.1"/>
      <path d="M-12 4 L-4 12 L12 -8" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="70" y="50" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0A2540">效率提升</text>

    <!-- Before/After comparison -->
    <text x="30" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">传统方式</text>
    <text x="30" y="130" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#9CA3AF">24h</text>
    <text x="30" y="150" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">人工采样周期</text>

    <!-- Arrow -->
    <g transform="translate(180, 120)">
      <path d="M0 0 L60 0" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <polygon points="60,0 50,-8 50,8" fill="#10B981"/>
    </g>

    <text x="260" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#10B981" font-weight="600">RiverWatch</text>
    <text x="260" y="130" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#10B981">实时</text>
    <text x="260" y="155" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#10B981">5 分钟自动更新</text>

    <!-- Improvement badge -->
    <rect x="30" y="190" width="200" height="36" rx="18" fill="#10B981" opacity="0.1"/>
    <text x="130" y="214" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="16" font-weight="700" fill="#10B981">提升 288 倍</text>
  </g>

  <!-- Card 2: 响应加速 -->
  <g transform="translate(660, 200)">
    <rect width="540" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="280" rx="2" fill="#00A8E8"/>

    <!-- Icon -->
    <g transform="translate(30, 30)">
      <circle r="24" fill="#00A8E8" opacity="0.1"/>
      <path d="M-8 -4 L0 4 L8 -4 M-8 4 L0 12 L8 4" fill="none" stroke="#00A8E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="70" y="50" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0A2540">响应加速</text>

    <!-- Before/After comparison -->
    <text x="30" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">传统方式</text>
    <text x="30" y="130" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#9CA3AF">4h</text>
    <text x="30" y="150" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">发现问题到上报</text>

    <!-- Arrow -->
    <g transform="translate(180, 120)">
      <path d="M0 0 L60 0" fill="none" stroke="#00A8E8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="60,0 50,-8 50,8" fill="#00A8E8"/>
    </g>

    <text x="260" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#00A8E8" font-weight="600">RiverWatch</text>
    <text x="260" y="130" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#00A8E8">分钟级</text>
    <text x="260" y="155" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#00A8E8">超标秒级感知</text>

    <!-- Improvement badge -->
    <rect x="30" y="190" width="200" height="36" rx="18" fill="#00A8E8" opacity="0.1"/>
    <text x="130" y="214" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="16" font-weight="700" fill="#00A8E8">缩短 99%+</text>
  </g>

  <!-- Card 3: 成本可控 -->
  <g transform="translate(1240, 200)">
    <rect width="540" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="280" rx="2" fill="#F59E0B"/>

    <!-- Icon -->
    <g transform="translate(30, 30)">
      <circle r="24" fill="#F59E0B" opacity="0.1"/>
      <text x="0" y="6" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="20" font-weight="700" fill="#F59E0B">¥</text>
    </g>

    <text x="70" y="50" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0A2540">成本可控</text>

    <!-- Before/After comparison -->
    <text x="30" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#6B7280">传统方式</text>
    <text x="30" y="130" font-family="'DIN 1451', monospace" font-size="28" font-weight="700" fill="#9CA3AF">服务器</text>
    <text x="30" y="150" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA3AF">年运维成本 ¥2万+</text>

    <!-- Arrow -->
    <g transform="translate(180, 120)">
      <path d="M0 0 L60 0" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <polygon points="60,0 50,-8 50,8" fill="#F59E0B"/>
    </g>

    <text x="260" y="100" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#F59E0B" font-weight="600">RiverWatch</text>
    <text x="260" y="130" font-family="'DIN 1451', monospace" font-size="36" font-weight="700" fill="#F59E0B">¥0</text>
    <text x="260" y="155" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#F59E0B">CDN 零服务器成本</text>

    <!-- Improvement badge -->
    <rect x="30" y="190" width="200" height="36" rx="18" fill="#F59E0B" opacity="0.1"/>
    <text x="130" y="214" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="16" font-weight="700" fill="#F59E0B">节省 100%</text>
  </g>

  <!-- Bottom: Summary comparison table -->
  <g transform="translate(80, 530)">
    <text x="0" y="0" font-family="'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#0A2540">传统方式 vs RiverWatch 对比</text>

    <rect x="0" y="20" width="1760" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="0" y="20" width="4" height="280" rx="2" fill="#0A2540"/>

    <!-- Table header -->
    <rect x="0" y="20" width="1760" height="50" rx="12" fill="#0A2540"/>
    <rect x="0" y="45" width="1760" height="25" fill="#0A2540"/>

    <text x="40" y="52" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">对比维度</text>
    <text x="440" y="52" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">传统方式</text>
    <text x="840" y="52" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">RiverWatch</text>
    <text x="1240" y="52" font-family="'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">提升幅度</text>

    <!-- Row 1: Data update -->
    <text x="40" y="100" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">数据更新频率</text>
    <text x="440" y="100" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">人工采样，24-48h 延迟</text>
    <text x="840" y="100" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#10B981" font-weight="600">自动采集，5 分钟刷新</text>
    <text x="1240" y="100" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#10B981">↑ 288×</text>

    <line x1="30" y1="115" x2="1730" y2="115" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Row 2: Alert response -->
    <text x="40" y="150" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">异常响应时间</text>
    <text x="440" y="150" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">4-6 小时上报流程</text>
    <text x="840" y="150" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#00A8E8" font-weight="600">秒级预警，自动标红</text>
    <text x="1240" y="150" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#00A8E8">↑ 99%+</text>

    <line x1="30" y1="165" x2="1730" y2="165" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Row 3: Visualization -->
    <text x="40" y="200" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">数据可视化</text>
    <text x="440" y="200" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">Excel 表格，分散存储</text>
    <text x="840" y="200" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#8B5CF6" font-weight="600">仪表盘 + 趋势图 + 地图</text>
    <text x="1240" y="200" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#8B5CF6">质的飞跃</text>

    <line x1="30" y1="215" x2="1730" y2="215" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Row 4: Cost -->
    <text x="40" y="250" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#0A2540" font-weight="500">运维成本</text>
    <text x="440" y="250" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#6B7280">服务器 + 人力，年 ¥2万+</text>
    <text x="840" y="250" font-family="'Noto Sans SC', sans-serif" font-size="14" fill="#F59E0B" font-weight="600">CDN 托管，零服务器成本</text>
    <text x="1240" y="250" font-family="'DIN 1451', monospace" font-size="14" font-weight="700" fill="#F59E0B">↓ 100%</text>
  </g>

  <!-- Growth arrow decoration -->
  <g transform="translate(1600, 860)">
    <path d="M0 80 Q40 40 80 20 Q120 0 160 -20" fill="none" stroke="url(#growthGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="160,-20 145,-15 150,-5" fill="#00A8E8"/>

    <!-- Growth labels -->
    <text x="80" y="70" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" fill="#10B981" font-weight="700">效率 ↑</text>
    <text x="120" y="40" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" fill="#00A8E8" font-weight="700">响应 ↑</text>
    <text x="160" y="10" text-anchor="middle" font-family="'DIN 1451', monospace" font-size="14" fill="#F59E0B" font-weight="700">成本 ↓</text>
  </g>

  <!-- Page number -->
  <text x="1840" y="1050" text-anchor="end" font-family="'DIN 1451', monospace" font-size="14" fill="#6B7280">09 / 10</text>
</svg>