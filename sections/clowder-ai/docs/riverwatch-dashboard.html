<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RiverWatch — 水质监测仪表板</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://waterservices.usgs.gov">
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.5s ease-out both;
    }
    .animate-shimmer {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Status dot pulse */
    .status-pulse::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Touch-friendly tap targets */
    .tap-target {
      min-height: 44px;
      min-width: 44px;
    }

    /* Card hover lift (desktop only) */
    @media (hover: hover) {
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }
    }

    /* Landscape mobile: 2-column grid */
    @media (min-width: 640px) and (max-height: 500px) {
      .landscape-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="app" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative w-10 h-10 flex items-center justify-center bg-sky-500 rounded-xl">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold leading-tight text-slate-900">RiverWatch</h1>
            <p class="text-xs text-slate-500">水质实时监测</p>
          </div>
        </div>
        <button
          @click="fetchData"
          :disabled="loading"
          class="tap-target flex items-center gap-1.5 px-3 py-2 rounded-lg bg-sky-50 text-sky-700 text-sm font-medium active:bg-sky-100 transition-colors disabled:opacity-50"
        >
          <svg class="w-4 h-4" :class="{ 'animate-spin': loading }" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="hidden sm:inline">刷新</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-3xl mx-auto w-full px-4 py-4 sm:py-6">

      <!-- Site Info -->
      <section class="mb-4 animate-fade-in-up" style="animation-delay: 0.05s">
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-start gap-3">
            <div class="mt-0.5 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <h2 class="text-sm font-semibold text-slate-900">PECONIC RIVER at COUNTY HWY 105 at RIVERHEAD, NY</h2>
              <p class="text-xs text-slate-500 mt-0.5">USGS 站点编号：01304562</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <div class="relative">
                <span
                  class="status-pulse relative inline-block w-2.5 h-2.5 rounded-full"
                  :class="siteStatusDotClass"
                ></span>
              </div>
              <span class="text-xs font-medium" :class="siteStatusTextClass">{{ siteStatusLabel }}</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Loading Skeleton -->
      <template v-if="loading && !error">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 landscape-grid">
          <div v-for="n in 6" :key="n" class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 rounded-xl animate-shimmer"></div>
              <div class="flex-1 space-y-2">
                <div class="h-4 w-24 rounded animate-shimmer"></div>
                <div class="h-3 w-16 rounded animate-shimmer"></div>
              </div>
            </div>
            <div class="h-8 w-20 rounded animate-shimmer mb-2"></div>
            <div class="h-3 w-32 rounded animate-shimmer"></div>
          </div>
        </div>
      </template>

      <!-- Error State -->
      <div
        v-else-if="error"
        class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center animate-fade-in-up"
      >
        <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-red-100 flex items-center justify-center">
          <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <h3 class="text-base font-semibold text-red-800 mb-1">数据加载失败</h3>
        <p class="text-sm text-red-600 mb-4">{{ error }}</p>
        <button
          @click="fetchData"
          class="tap-target inline-flex items-center gap-2 px-5 py-2.5 bg-red-600 text-white text-sm font-medium rounded-xl active:bg-red-700 transition-colors shadow-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/>
          </svg>
          重试
        </button>
      </div>

      <!-- Data Grid -->
      <div
        v-else
        class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 landscape-grid"
      >
        <indicator-card
          v-for="(indicator, index) in indicators"
          :key="indicator.param"
          :indicator="indicator"
          :style="{ animationDelay: (0.1 + index * 0.05) + 's' }"
        />
      </div>

      <!-- Supplementary Section -->
      <section v-if="!loading && !error" class="mt-5 animate-fade-in-up" style="animation-delay: 0.4s">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1">辅助参数</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 landscape-grid">
          <indicator-card
            v-for="(indicator, index) in supplementary"
            :key="indicator.param"
            :indicator="indicator"
            :style="{ animationDelay: (0.45 + index * 0.05) + 's' }"
          />
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
      <div class="max-w-3xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p class="text-xs text-slate-500">
          数据来源：
          <a href="https://waterservices.usgs.gov/" target="_blank" rel="noopener noreferrer" class="text-sky-600 hover:underline">USGS NWIS</a>
        </p>
        <p v-if="lastUpdated" class="text-xs text-slate-400">
          最后更新：{{ lastUpdated }}
        </p>
      </div>
    </footer>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // ── Indicator Card Component ───────────────────────────────────────
    const IndicatorCard = {
      name: 'IndicatorCard',
      props: ['indicator'],
      setup(props) {
        const { indicator: ind } = props;

        const statusConfig = computed(() => {
          if (ind.notReturned)  return { label: '未返回', dot: 'bg-slate-300', text: 'text-slate-400', border: 'border-slate-200', bg: 'bg-slate-50' };
          if (ind.value == null) return { label: 'N/A',    dot: 'bg-slate-300', text: 'text-slate-400', border: 'border-slate-200', bg: 'bg-slate-50' };
          if (ind.status === 'danger')  return { label: '异常', dot: 'bg-red-500',    text: 'text-red-600',    border: 'border-red-200',    bg: 'bg-red-50' };
          if (ind.status === 'warning') return { label: '预警', dot: 'bg-amber-500',  text: 'text-amber-600',  border: 'border-amber-200',  bg: 'bg-amber-50' };
          return { label: '正常', dot: 'bg-emerald-500', text: 'text-emerald-600', border: 'border-emerald-200', bg: 'bg-emerald-50' };
        });

        const iconBgClass = computed(() => {
          if (ind.notReturned || ind.value == null) return 'bg-slate-100 text-slate-400';
          if (ind.status === 'danger')  return 'bg-red-100 text-red-600';
          if (ind.status === 'warning') return 'bg-amber-100 text-amber-600';
          return 'bg-emerald-100 text-emerald-600';
        });

        const showTooltip = ref(false);

        return { ind, statusConfig, iconBgClass, showTooltip };
      },
      template: `
        <div
          class="card-hover bg-white rounded-2xl border p-4 shadow-sm transition-all duration-200 animate-fade-in-up relative"
          :class="statusConfig.border"
          @mouseenter="showTooltip = true"
          @mouseleave="showTooltip = false"
          @touchstart="showTooltip = !showTooltip"
        >
          <!-- Header -->
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" :class="iconBgClass">
              <svg v-if="ind.icon === 'ph'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/>
              </svg>
              <svg v-else-if="ind.icon === 'oxygen'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
              </svg>
              <svg v-else-if="ind.icon === 'turbidity'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
              </svg>
              <svg v-else-if="ind.icon === 'ammonia'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
              </svg>
              <svg v-else-if="ind.icon === 'temp'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0112 21 8.25 8.25 0 016.038 7.048 8.287 8.287 0 009 9.6a8.983 8.983 0 013.361-6.867 8.21 8.21 0 003 2.48z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 00.495-7.467 5.99 5.99 0 00-1.925 3.546 5.974 5.974 0 01-2.133-1A3.75 3.75 0 0012 18z"/>
              </svg>
              <svg v-else-if="ind.icon === 'conductance'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
              </svg>
              <svg v-else class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.431l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.212 1.281c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.431l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-semibold text-slate-900 truncate">{{ ind.name }}</h4>
              <p class="text-xs text-slate-500">{{ ind.nameEn }}</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="w-2 h-2 rounded-full" :class="statusConfig.dot"></span>
              <span class="text-xs font-medium" :class="statusConfig.text">{{ statusConfig.label }}</span>
            </div>
          </div>

          <!-- Value -->
          <div class="flex items-baseline gap-2">
            <span class="text-3xl font-bold tracking-tight" :class="ind.value == null || ind.notReturned ? 'text-slate-400' : 'text-slate-900'">
              {{ ind.displayValue }}
            </span>
            <span v-if="ind.unit && !ind.notReturned" class="text-sm text-slate-500 font-medium">{{ ind.unit }}</span>
          </div>

          <!-- Timestamp -->
          <p v-if="ind.timestamp && !ind.notReturned" class="text-xs text-slate-400 mt-1.5">
            测量时间：{{ formatTime(ind.timestamp) }}
          </p>

          <!-- Tooltip -->
          <div
            v-if="ind.notReturned || ind.value == null"
            v-show="showTooltip"
            class="absolute z-20 bottom-full left-1/2 -translate-x-1/2 mb-2 w-56 px-3 py-2 bg-slate-800 text-white text-xs rounded-lg shadow-lg"
          >
            <p v-if="ind.notReturned">USGS API 未返回此参数数据。该站点可能未监测此项指标。</p>
            <p v-else>API 返回了此参数但数值为空（null）。可能是传感器暂时离线。</p>
            <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-800"></div>
          </div>
        </div>
      `,
    };

    // ── Main App ───────────────────────────────────────────────────────
    createApp({
      components: { IndicatorCard },
      setup() {
        const loading = ref(false);
        const error = ref('');
        const lastUpdated = ref('');
        const rawData = ref(null);

        // Parameter definitions
        const PARAMS = {
          '00400':  { name: 'pH 值',            nameEn: 'pH',                   unit: '',     icon: 'ph',         type: 'ph' },
          '00300':  { name: '溶解氧',           nameEn: 'Dissolved Oxygen',     unit: 'mg/L', icon: 'oxygen',     type: 'do' },
          '63680':  { name: '浊度',             nameEn: 'Turbidity',            unit: 'NTU',  icon: 'turbidity',  type: 'turbidity' },
          '00608':  { name: '氨氮',             nameEn: 'Ammonia Nitrogen',     unit: 'mg/L', icon: 'ammonia',    type: 'ammonia' },
          '00610':  { name: '氨氮 (alt)',       nameEn: 'Ammonia Nitrogen',     unit: 'mg/L', icon: 'ammonia',    type: 'ammonia' },
          '00010':  { name: '水温',             nameEn: 'Water Temperature',    unit: '°C',   icon: 'temp',       type: 'temp' },
          '00095':  { name: '比电导率',         nameEn: 'Specific Conductance', unit: 'μS/cm',icon: 'conductance',type: 'conductance' },
        };

        function formatTime(iso) {
          if (!iso) return '';
          const d = new Date(iso);
          if (isNaN(d)) return iso;
          const pad = n => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function evaluateStatus(type, value) {
          if (value == null) return 'na';
          switch (type) {
            case 'ph':        return (value >= 6.5 && value <= 8.5) ? 'normal' : (value >= 6.0 && value <= 9.0) ? 'warning' : 'danger';
            case 'do':        return value >= 5.0 ? 'normal' : value >= 3.0 ? 'warning' : 'danger';
            case 'turbidity': return value <= 5 ? 'normal' : value <= 50 ? 'warning' : 'danger';
            case 'ammonia':   return value <= 0.5 ? 'normal' : value <= 2.0 ? 'warning' : 'danger';
            case 'temp':      return value >= 0 && value <= 35 ? 'normal' : 'warning';
            case 'conductance': return value >= 50 && value <= 1500 ? 'normal' : 'warning';
            default: return 'normal';
          }
        }

        function buildIndicators() {
          if (!rawData.value) return { main: [], supplementary: [] };

          const ts = rawData.value.value?.timeSeries || [];
          const byParam = {};

          ts.forEach(series => {
            const vInfo = series.variable || {};
            const pcode = String(vInfo.variableCode?.[0]?.value || '');
            if (!pcode) return;

            const vals = series.values?.[0]?.value || [];
            const latest = vals[vals.length - 1];
            byParam[pcode] = {
              value: latest?.value != null ? parseFloat(latest.value) : null,
              timestamp: latest?.dateTime || null,
            };
          });

          const makeInd = (pcode) => {
            const meta = PARAMS[pcode];
            const data = byParam[pcode];
            const notReturned = !data;
            const val = data?.value ?? null;
            return {
              param: pcode,
              name: meta.name,
              nameEn: meta.nameEn,
              unit: meta.unit,
              icon: meta.icon,
              value: val,
              displayValue: notReturned ? '未返回' : (val == null ? 'N/A' : String(val)),
              timestamp: data?.timestamp || null,
              status: evaluateStatus(meta.type, val),
              notReturned,
            };
          };

          // Ammonia: prefer 00608, fallback 00610
          let ammoniaInd = makeInd('00608');
          if (ammoniaInd.notReturned) {
            const alt = makeInd('00610');
            if (!alt.notReturned) ammoniaInd = alt;
          }

          const main = [
            makeInd('00400'),
            makeInd('00300'),
            makeInd('63680'),
            ammoniaInd,
          ];

          const supplementary = [
            makeInd('00010'),
            makeInd('00095'),
          ];

          return { main, supplementary };
        }

        const indicators = computed(() => buildIndicators().main);
        const supplementary = computed(() => buildIndicators().supplementary);

        const siteStatusLabel = computed(() => {
          if (loading.value) return '加载中';
          if (error.value) return '离线';
          const all = [...indicators.value, ...supplementary.value];
          const hasDanger = all.some(i => i.status === 'danger');
          const hasWarning = all.some(i => i.status === 'warning');
          if (hasDanger) return '异常';
          if (hasWarning) return '预警';
          return '正常';
        });

        const siteStatusDotClass = computed(() => {
          if (loading.value) return 'bg-slate-300';
          if (error.value) return 'bg-red-500';
          const all = [...indicators.value, ...supplementary.value];
          const hasDanger = all.some(i => i.status === 'danger');
          const hasWarning = all.some(i => i.status === 'warning');
          if (hasDanger) return 'bg-red-500';
          if (hasWarning) return 'bg-amber-500';
          return 'bg-emerald-500';
        });

        const siteStatusTextClass = computed(() => {
          if (loading.value) return 'text-slate-400';
          if (error.value) return 'text-red-600';
          const all = [...indicators.value, ...supplementary.value];
          const hasDanger = all.some(i => i.status === 'danger');
          const hasWarning = all.some(i => i.status === 'warning');
          if (hasDanger) return 'text-red-600';
          if (hasWarning) return 'text-amber-600';
          return 'text-emerald-600';
        });

        async function fetchData() {
          loading.value = true;
          error.value = '';
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);

          try {
            const url = 'https://waterservices.usgs.gov/nwis/iv/?format=json&sites=01304562&parameterCd=00010,00095,00300,00400,63680,00608,00610&siteStatus=all';
            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!res.ok) {
              throw new Error(`API 错误：HTTP ${res.status} ${res.statusText}`);
            }

            const json = await res.json();
            rawData.value = json;
            lastUpdated.value = new Date().toLocaleString('zh-CN');
          } catch (err) {
            if (err.name === 'AbortError') {
              error.value = '请求超时，请检查网络连接后重试。';
            } else if (err.message?.includes('Failed to fetch') || err.message?.includes('NetworkError')) {
              error.value = '网络连接失败，请检查网络后重试。';
            } else {
              error.value = err.message || '未知错误，请稍后重试。';
            }
          } finally {
            loading.value = false;
            clearTimeout(timeoutId);
          }
        }

        onMounted(() => {
          fetchData();
        });

        return {
          loading,
          error,
          lastUpdated,
          indicators,
          supplementary,
          siteStatusLabel,
          siteStatusDotClass,
          siteStatusTextClass,
          fetchData,
          formatTime,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
