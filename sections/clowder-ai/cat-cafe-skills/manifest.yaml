# Cat Cafe Skills Manifest - AgentHub target profile
#
# This manifest is intentionally small.  It keeps the skills needed for the
# AgentHub coursework target: IM multi-agent demo, runnable implementation,
# collaboration evidence, product/technical docs, and a short demo video.

skills:
  feat-lifecycle:
    description: >
      Feature 立项、讨论、完成的全生命周期管理。
      Use when: 开个新功能、new feature、立项、feature 完成、验收通过、讨论新功能需求。
      Not for: 代码实现、review、merge。
      Output: Feature 聚合文件 + BACKLOG/issue 状态同步。
    triggers:
      - "开个新功能"
      - "new feature"
      - "立项"
      - "feature 完成"
      - "验收通过"
      - "讨论新功能需求"
    not_for:
      - "写代码"
      - "review"
      - "merge"
    output: "Feature record and status sync"
    next: ["collaborative-thinking", "writing-plans"]
    sop_step: null
    merged_from: ["feat-kickoff", "feat-discussion", "feat-completion"]

  collaborative-thinking:
    description: >
      单人或多 Agent 的创意探索、方案比较和讨论收敛。
      Use when: brainstorm、多 Agent 独立思考、讨论结束需要收敛、方向性问题需要多视角。
      Not for: 已有明确 spec 直接写代码、单 Agent 执行已定方案。
      Output: 共识/分歧/行动项 + 必要沉淀检查。
    triggers:
      - "brainstorm"
      - "讨论"
      - "多 Agent 思考"
      - "多猫独立思考"
      - "收敛"
      - "总结一下"
    not_for:
      - "已有 spec 直接写代码"
      - "单人执行"
    output: "Consensus, disagreements, and action items"
    next: ["feat-lifecycle", "writing-plans"]
    sop_step: null
    merged_from: ["brainstorming", "multi-cat-brainstorm", "discussion-convergence"]

  writing-plans:
    description: >
      将 spec/需求拆分为可执行的分步实施计划。
      Use when: 有 spec 或需求，准备动手前需要拆分步骤。
      Not for: trivial 改动、已有详细计划。
      Output: 分步实施计划，包含验证检查点。
    triggers:
      - "写计划"
      - "implementation plan"
      - "拆分步骤"
    not_for:
      - "trivial 改动"
      - "已有计划"
    output: "Phased implementation plan"
    next: ["tdd"]
    sop_step: null
    merged_from: null

  tdd:
    description: >
      Red-Green-Refactor 测试驱动开发纪律。
      Use when: 写新功能代码、修 bug、任何实现工作。
      Not for: 纯文档、纯调研、已有充分测试的 trivial 改动。
      Output: 失败测试 -> 最小实现 -> 回归验证。
    triggers:
      - "写代码"
      - "test first"
      - "TDD"
      - "红绿重构"
    not_for:
      - "纯文档"
      - "调研"
    output: "Tests plus implementation"
    next: ["quality-gate"]
    sop_step: 1
    merged_from: ["test-driven-development"]

  debugging:
    description: >
      系统化 bug 定位：复现、日志、调用链、假设验证、修复。
      Use when: 遇到 bug、测试失败、unexpected behavior。
      Not for: 新功能开发、重构、已知原因的简单修复。
      Output: 根因说明 + 修复 + 回归测试。
    triggers:
      - "bug"
      - "报错"
      - "test failure"
      - "unexpected behavior"
      - "一直转圈"
    not_for:
      - "新功能"
      - "重构"
    output: "Root cause, fix, and regression proof"
    next: ["tdd", "quality-gate"]
    sop_step: null
    merged_from: ["systematic-debugging"]

  quality-gate:
    description: >
      开发完成后的自检门禁：target/spec 对照 + 真实验证。
      Use when: 开发完了准备交付、准备 review、声称完成。
      Not for: 收到 review 反馈、准备合入发布。
      Output: 合规报告和新鲜验证证据。
    triggers:
      - "开发完了"
      - "准备 review"
      - "自检"
      - "声称完成"
    not_for:
      - "收到 review 反馈"
      - "merge"
    output: "Spec compliance report with verification evidence"
    next: ["review-and-release"]
    sop_step: 2
    merged_from: ["spec-compliance-check", "verification-before-completion"]

  review-and-release:
    description: >
      代码完成后的 review、反馈处理、PR/merge 和发布收尾流程。
      Use when: 自检通过后要请求 review、收到 review 反馈、PR 已批准、CI 通过、或准备合入发布。
      Not for: 开发前计划、调试定位、未完成代码的日常讨论。
      Output: review 请求/反馈处理记录/合入检查结果，附验证证据。
    triggers:
      - "请 review"
      - "request review"
      - "review 结果"
      - "reviewer 说"
      - "fix these"
      - "准备合入"
      - "merge"
      - "开 PR"
      - "CI 通过"
    not_for:
      - "开发前计划"
      - "调试定位"
      - "未完成代码"
    output: "Review, feedback, and release record"
    next: ["feat-lifecycle"]
    sop_step: [3, 4, 5, 6]
    merged_from: ["request-review", "receive-review", "merge-gate"]

  multi-agent-collaboration:
    description: >
      多 Agent / 多 thread 协作的轻量协议。
      Use when: 需要交接任务、通知并行 session、协调共享文件争用、或把一个大任务拆给多个 Agent/thread。
      Not for: 单人可直接完成的小任务、纯代码实现、普通 review 发布流程。
      Output: 协作消息或拆分计划，包含 What / Why / Tradeoff / Open / Next。
    triggers:
      - "交接"
      - "传话"
      - "handoff"
      - "跨 thread"
      - "并行推进"
      - "拆任务"
      - "分 thread"
      - "多 Agent 协作"
    not_for:
      - "单人可直接完成"
      - "纯代码实现"
      - "review 发布流程"
    output: "Collaboration packet or task split"
    next: ["writing-plans", "tdd", "quality-gate"]
    sop_step: null
    merged_from: ["cross-cat-handoff", "cross-thread-sync", "thread-orchestration"]

  deep-research:
    description: >
      多源深度调研管道。
      Use when: 技术问题需要多源调查、设计决策需要证据、用户说调研/research。
      Not for: 简单搜索、已有结论的确认、普通代码符号查找。
      Output: 调研报告 + 证据合成。
    triggers:
      - "调研"
      - "research"
      - "深度研究"
    not_for:
      - "简单搜索"
      - "已有结论"
      - "代码符号查找"
    output: "Research report with evidence synthesis"
    next: ["collaborative-thinking", "writing-plans"]
    sop_step: null
    merged_from: ["deep-research-pipeline"]

  browser-preview:
    description: >
      Hub 内嵌浏览器预览 localhost 应用。
      Use when: 写前端代码、跑 dev server、需要看页面效果、调 UI、用户说看看效果。
      Not for: 后端纯 API 开发、不涉及页面的工作、外部网站浏览。
      Output: 前端页面在 Hub browser panel 中实时预览。
    triggers:
      - "看效果"
      - "看看页面"
      - "preview"
      - "浏览器预览"
      - "localhost"
      - "前端效果"
      - "看看 UI"
    not_for:
      - "后端纯 API 开发"
      - "不涉及页面"
      - "外部网站浏览"
    output: "Browser panel preview in Hub"
    next: ["quality-gate"]
    sop_step: null
    merged_from: null
    feature: "F120"

  design-assets:
    description: >
      AgentHub Demo 的视觉资产、设计稿、截图、富媒体卡片和展示素材处理。
      Use when: 需要 UI 参考图、头像/图片资产、设计稿、截图对比、富媒体卡片、Demo 展示素材。
      Not for: 纯文字回复、后端 API 开发、正式视频剪辑。
      Output: 可复用资产或富媒体展示，附保存路径和用途说明。
    triggers:
      - "生成图片"
      - "设计稿"
      - "富媒体"
      - "rich block"
      - "发图"
      - "发卡片"
      - "截图"
      - "UI 参考"
      - "头像"
    not_for:
      - "纯文字回复"
      - "后端 API 开发"
      - "正式视频剪辑"
    output: "Design asset or rich media presentation"
    next: ["browser-preview", "video-forge"]
    sop_step: null
    merged_from: ["image-generation", "pencil-design", "rich-messaging"]

  video-forge:
    description: >
      Demo 视频制作全链路：素材、脚本、录屏、剪辑、审查、交付。
      Use when: 做 3 分钟 Demo 视频、showcase、教程视频、录屏剪辑、video review。
      Not for: 纯代码开发、纯文档写作、单张截图或卡片展示。
      Output: 可发布的视频成片或视频制作包。
    triggers:
      - "做视频"
      - "3 分钟 Demo"
      - "showcase 视频"
      - "教程视频"
      - "录屏剪辑"
      - "video review"
    not_for:
      - "纯代码开发"
      - "纯文档写作"
      - "单张截图"
    output: "Demo video or production package"
    next: ["quality-gate"]
    sop_step: null
    merged_from: null

  writing-skills:
    description: >
      创建或修改 Cat Cafe skill / MCP tool description 的元技能。
      Use when: 写新 skill、修改现有 skill、动 cat-cafe-skills/ 或 manifest.yaml。
      Not for: 使用 skill 完成普通任务。
      Output: 新/更新的 SKILL.md + manifest 条目 + 校验证据。
    triggers:
      - "写 skill"
      - "新 skill"
      - "修改 skill"
      - "SKILL.md"
      - "cat-cafe-skills/"
      - "manifest.yaml skill"
    not_for:
      - "使用 skill"
      - "普通任务"
    output: "SKILL.md, manifest entry, and validation evidence"
    next: ["quality-gate"]
    sop_step: null
    merged_from: null

refs:
  mcp-callbacks:
    description: "HTTP callback API 参考"
    path: "refs/mcp-callbacks.md"
  rich-blocks:
    description: "Rich block 创建指南，已并入 design-assets"
    path: "refs/rich-blocks.md"
  pr-template:
    description: "PR 创建模板"
    path: "refs/pr-template.md"
  review-request-template:
    description: "Review 请求模板，已并入 review-and-release"
    path: "refs/review-request-template.md"
  requirements-checklist-template:
    description: "需求点 checklist 模板"
    path: "refs/requirements-checklist-template.md"
  shared-rules:
    description: "共用协作规则"
    path: "refs/shared-rules.md"

iron_laws:
  - id: no-self-review
    rule: "同一个体不能 review 自己的代码"
  - id: no-impersonation
    rule: "不能冒充其他 Agent"
  - id: evidence-before-claims
    rule: "没有新鲜验证证据，不能声称完成"

lint:
  rules:
    - id: has-triggers
      check: "每个 skill 必须有 triggers 和 not_for"
    - id: has-output
      check: "每个 skill 必须有 output 契约"
    - id: next-exists
      check: "next 指向的 skill 必须在 manifest 中存在"
    - id: no-overmerge
      check: "合并后的 description 不能变成什么都能做"
