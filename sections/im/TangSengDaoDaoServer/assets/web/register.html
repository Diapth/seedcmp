<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐僧叨叨 - 注册</title>
<link rel="icon" href="/logo.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 40px;
  width: 400px;
  max-width: 90vw;
}
.logo { text-align: center; margin-bottom: 32px; }
.logo img { width: 64px; height: 64px; border-radius: 12px; }
.logo h1 { font-size: 22px; margin-top: 12px; color: #1a1a1a; font-weight: 600; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; font-weight: 500; }
.form-group input {
  width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0;
  border-radius: 8px; font-size: 15px; outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus { border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,0.1); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.btn {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  background: #4f8cff; color: #fff; transition: background 0.2s;
}
.btn:hover { background: #3a78f0; }
.btn:disabled { background: #a0c0ff; cursor: not-allowed; }
.error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
.success { color: #27ae60; font-size: 13px; margin-top: 12px; display: none; }
.footer { text-align: center; margin-top: 20px; font-size: 14px; color: #999; }
.footer a { color: #4f8cff; text-decoration: none; }
.footer a:hover { text-decoration: underline; }
.code-row { display: flex; gap: 8px; }
.code-row .form-group { flex: 1; }
.code-row .btn-code {
  flex-shrink: 0; padding: 10px 16px; border: 1px solid #4f8cff;
  border-radius: 8px; font-size: 14px; cursor: pointer;
  background: #fff; color: #4f8cff; white-space: nowrap; height: 44px;
  transition: all 0.2s;
}
.code-row .btn-code:hover { background: #f0f5ff; }
.code-row .btn-code:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
.spinner { display: none; text-align: center; margin-top: 12px; }
.spinner::after {
  content: ''; display: inline-block; width: 20px; height: 20px;
  border: 2px solid #e0e0e0; border-top-color: #4f8cff;
  border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="/logo.png" alt="唐僧叨叨">
    <h1>创建账号</h1>
  </div>

  <div class="form-row">
    <div class="form-group" style="flex: 0 0 100px;">
      <label>区号</label>
      <input type="text" id="zone" value="86" placeholder="86">
    </div>
    <div class="form-group">
      <label>手机号</label>
      <input type="text" id="phone" placeholder="13800138000" maxlength="11">
    </div>
  </div>

  <div class="form-group">
    <label>昵称</label>
    <input type="text" id="name" placeholder="输入昵称">
  </div>

  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="至少6位密码" minlength="6">
  </div>

  <div class="code-row">
    <div class="form-group">
      <label>验证码</label>
      <input type="text" id="code" placeholder="验证码" maxlength="6">
    </div>
    <button class="btn-code" id="sendCode" onclick="sendCode()">获取验证码</button>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <div class="spinner" id="spinner"></div>

  <button class="btn" id="registerBtn" onclick="register()">注册</button>

  <div class="footer">
    已有账号？<a href="/">去登录</a>
  </div>
</div>

<script>
const API_BASE = '/api';

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('success').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('success');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('error').style.display = 'none';
}

function hideMessages() {
  document.getElementById('error').style.display = 'none';
  document.getElementById('success').style.display = 'none';
}

function setLoading(loading) {
  document.getElementById('spinner').style.display = loading ? 'block' : 'none';
  document.getElementById('registerBtn').disabled = loading;
}

async function register() {
  hideMessages();
  const zone = document.getElementById('zone').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const name = document.getElementById('name').value.trim();
  const password = document.getElementById('password').value;
  const code = document.getElementById('code').value.trim();

  if (!phone) { showError('请输入手机号'); return; }
  if (!name) { showError('请输入昵称'); return; }
  if (!password || password.length < 6) { showError('密码至少6位'); return; }
  if (!code) { showError('请输入验证码'); return; }

  setLoading(true);
  try {
    const resp = await fetch(API_BASE + '/v1/user/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zone, phone, name, password, code, flag: 1 })
    });
    const data = await resp.json();
    if (resp.ok) {
      showSuccess('注册成功！正在跳转到登录页...');
      setTimeout(() => { window.location.href = '/'; }, 1500);
    } else {
      showError(data.msg || '注册失败');
    }
  } catch (err) {
    showError('网络错误，请重试');
  } finally {
    setLoading(false);
  }
}

async function sendCode() {
  const zone = document.getElementById('zone').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!phone) { showError('请先输入手机号'); return; }

  const btn = document.getElementById('sendCode');
  btn.disabled = true;

  try {
    const resp = await fetch(API_BASE + '/v1/user/sms/registercode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zone, phone })
    });
    const data = await resp.json();
    if (resp.ok) {
      showSuccess('验证码已发送（开发模式验证码：123456）');
    } else {
      if (data.exist === 1) {
        showError('该手机号已注册');
      } else {
        showError(data.msg || '发送失败');
      }
      btn.disabled = false;
      return;
    }
  } catch (err) {
    showError('网络错误，请重试');
    btn.disabled = false;
    return;
  }

  let count = 60;
  const timer = setInterval(() => {
    btn.textContent = count + 's';
    if (count <= 0) {
      clearInterval(timer);
      btn.textContent = '获取验证码';
      btn.disabled = false;
    }
    count--;
  }, 1000);
}
</script>
</body>
</html>
